openapi: 3.0.3
info:
  title: Banking API
  description: |-
    API para gestión de cuentas bancarias y transacciones financieras.
    Permite:
    - Crear y gestionar cuentas bancarias
    - Registrar transacciones (depósitos/retiros)
    - Consultar historiales
  version: 1.0.0
  contact:
    name: Soporte Técnico
    email: soporte@banco.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080/api
    description: Servidor de desarrollo local
  - url: https://api.banco.com/v1
    description: Servidor de producción

tags:
  - name: Accounts
    description: Operaciones con cuentas bancarias
    externalDocs:
      description: Guía de cuentas
      url: https://docs.banco.com/accounts
  - name: Transactions
    description: Operaciones con transacciones financieras
    externalDocs:
      description: Guía de transacciones
      url: https://docs.banco.com/transactions

paths:
  /accounts:
    post:
      tags: [Accounts]
      summary: Crear nueva cuenta bancaria
      description: Registra una nueva cuenta en el sistema con saldo inicial
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
            example:
              owner: "María González"
              balance: 1000.50
      responses:
        '201':
          description: Cuenta creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Accounts]
      summary: Listar todas las cuentas
      description: Retorna un listado paginado de todas las cuentas registradas
      operationId: getAllAccounts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Listado de cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Obtener cuenta por ID
      description: Retorna los detalles de una cuenta específica
      operationId: getAccountById
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Detalles de la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Cuenta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Accounts]
      summary: Actualizar cuenta
      description: Actualiza la información de una cuenta existente
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

    delete:
      tags: [Accounts]
      summary: Eliminar cuenta
      description: Elimina permanentemente una cuenta del sistema
      operationId: deleteAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '204':
          description: Cuenta eliminada exitosamente
        '404':
          description: Cuenta no encontrada

  /transactions:
    post:
      tags: [Transactions]
      summary: Registrar nueva transacción
      description: Crea un registro de depósito o retiro en una cuenta
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
            example:
              accountId: 1
              amount: 200.75
              type: "DEPOSIT"
      responses:
        '201':
          description: Transacción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

    get:
      tags: [Transactions]
      summary: Listar todas las transacciones
      description: Retorna un listado paginado de transacciones
      operationId: getAllTransactions
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Listado de transacciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /transactions/account/{accountId}:
    get:
      tags: [Transactions]
      summary: Obtener transacciones por cuenta
      description: Retorna el historial de transacciones de una cuenta específica
      operationId: getTransactionsByAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Historial de transacciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /transactions/{id}:
    delete:
      tags: [Transactions]
      summary: Eliminar transacción
      description: Elimina un registro de transacción (solo para administradores)
      operationId: deleteTransaction
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '204':
          description: Transacción eliminada
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Account:
      type: object
      required: [owner, balance]
      properties:
        id:
          type: integer
          format: int64
          example: 1
          readOnly: true
        owner:
          type: string
          example: "Juan Pérez"
          minLength: 3
          maxLength: 100
        balance:
          type: number
          format: double
          minimum: 0
          example: 1500.50
      xml:
        name: "Account"

    Transaction:
      type: object
      required: [accountId, amount, type]
      properties:
        id:
          type: integer
          format: int64
          example: 1
          readOnly: true
        accountId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 200.50
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
          example: DEPOSIT
        date:
          type: string
          format: date-time
          example: "2025-05-02T14:30:00Z"
          readOnly: true
      xml:
        name: "Transaction"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  parameters:
    accountId:
      name: id
      in: path
      description: ID de la cuenta bancaria
      required: true
      schema:
        type: integer
        format: int64
    transactionId:
      name: id
      in: path
      description: ID de la transacción
      required: true
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      description: Número de página (0-based)
      required: false
      schema:
        type: integer
        default: 0
    size:
      name: size
      in: query
      description: Tamaño de página
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100