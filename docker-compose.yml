version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_banking
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  banking-api:
    build: .
    container_name: banking_api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_USERNAME: user
      DATABASE_PASSWORD: password
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata: